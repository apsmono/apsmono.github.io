<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arif Eko Pramono — Product Engineer (React · Firebase · AI agents)</title>
  <meta name="description" content="Product Engineer — React · React Native · Firebase · AI agents. Reliability-minded, growing into AI & agent engineering. Based in Blitar, Indonesia.">
  <!-- aps brand favicons -->
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#16150F">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    // Apply saved palette + theme before paint to avoid a flash.
    (function () {
      try {
        var p = localStorage.getItem("aps-palette");
        var valid = ["current", "mono", "image", "dev"];
        document.documentElement.setAttribute("data-palette", valid.indexOf(p) > -1 ? p : "current");
        var t = localStorage.getItem("dash-theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {
        document.documentElement.setAttribute("data-palette", "current");
      }
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
